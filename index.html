
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personality Quiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f4f4;
        }

        .question-block {
            width: 75%;
        }

        .answer-btn {
            min-height: 45px;
        }

        .selected {
            background-color: #0d6efd !important;
            color: white !important;
        }

        #result-container {
            margin-bottom: 40px;
        }
    </style>
</head>

<body>

    <h1 class="text-center mt-4">What Type of Person Are You?</h1>

    <!-- Question 1 -->
    <div class="container d-flex justify-content-center">
        <div class="card my-4 p-4 question-block">
            <h4 class="mb-3">What would you rather do on a weekend?</h4>
            <div class="row g-2">
                <div class="col-6">
                    <button class="btn btn-outline-primary w-100 answer-btn" data-category="adventurer">A: Go on an adventure</button>
                </div>
                <div class="col-6">
                    <button class="btn btn-outline-primary w-100 answer-btn" data-category="social">B: Hang out with friends</button>
                </div>
                <div class="col-6">
                    <button class="btn btn-outline-primary w-100 answer-btn" data-category="creative">C: Work on a creative project</button>
                </div>
                <div class="col-6">
                    <button class="btn btn-outline-primary w-100 answer-btn" data-category="chill">D: Relax and watch movies</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Question 2 -->
    <div class="container d-flex justify-content-center">
        <div class="card my-4 p-4 question-block">
            <h4 class="mb-3">How do you act in a group project?</h4>
            <div class="row g-2">
                <div class="col-6">
                    <button class="btn btn-outline-primary w-100 answer-btn" data-category="social">Take charge</button>
                </div>
                <div class="col-6">
                    <button class="btn btn-outline-primary w-100 answer-btn" data-category="creative">Come up with ideas</button>
                </div>
                <div class="col-6">
                    <button class="btn btn-outline-primary w-100 answer-btn" data-category="social">Help everyone</button>
                </div>
                <div class="col-6">
                    <button class="btn btn-outline-primary w-100 answer-btn" data-category="chill">Work quietly</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Question 3 -->
    <div class="container d-flex justify-content-center">
        <div class="card my-4 p-4 question-block">
            <h4 class="mb-3">Where would you rather go on vacation?</h4>
            <div class="row g-2">
                <div class="col-6">
                    <button class="btn btn-outline-primary w-100 answer-btn" data-category="adventurer">Explore a new country</button>
                </div>
                <div class="col-6">
                    <button class="btn btn-outline-primary w-100 answer-btn" data-category="creative">Visit an art city</button>
                </div>
                <div class="col-6">
                    <button class="btn btn-outline-primary w-100 answer-btn" data-category="social">Go with friends</button>
                </div>
                <div class="col-6">
                    <button class="btn btn-outline-primary w-100 answer-btn" data-category="chill">Relax at the beach</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Question 4 -->
    <div class="container d-flex justify-content-center">
        <div class="card my-4 p-4 question-block">
            <h4 class="mb-3">How do you handle a challenge?</h4>
            <div class="row g-2">
                <div class="col-6">
                    <button class="btn btn-outline-primary w-100 answer-btn" data-category="adventurer">Jump right in</button>
                </div>
                <div class="col-6">
                    <button class="btn btn-outline-primary w-100 answer-btn" data-category="creative">Think creatively</button>
                </div>
                <div class="col-6">
                    <button class="btn btn-outline-primary w-100 answer-btn" data-category="social">Ask others for help</button>
                </div>
                <div class="col-6">
                    <button class="btn btn-outline-primary w-100 answer-btn" data-category="chill">Take my time</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Results -->
    <div class="text-center my-4">
        <button id="show-results" class="btn btn-success btn-lg">
            Show Results
        </button>
    </div>

    <div class="container d-flex justify-content-center">
        <div id="result-container" class="card p-4 mb-4 text-center question-block">
            <h3>Your Results</h3>
            <p id="result-text">Answer all four questions to discover your personality!</p>
        </div>
    </div>

    <script src="./js/script.js"></script>

</body>
</html>
